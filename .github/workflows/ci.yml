name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Only the pure erosion/config module exists in this slice (see README.md Status) --
      # `./gradlew build` here does not yet exercise a NeoForge mod build or GameTest server,
      # unlike the sibling compat mods' fuller CI. Extend this job once that scaffold lands.
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: layered-slopes-dynamic-immersive-vehicles-test-results
          path: build/test-results/test/*.xml
          if-no-files-found: error
