name: Client-sync acceptance, default-OFF case (opt-in)

# Opt-in, CI-only, isolated runner (never Servy, never a shared/native-test-slot resource).
# Direction (comment 55058/55063): prove real client-observed synchronization, not server-only
# GameTest results or an UPDATE flag relabeled as client-sync evidence. NeoForge's GameTest
# framework runs entirely in-process against a ServerLevel and never sends a real client-bound
# packet, so this is the first slice that actually drives a REAL second process: a real headless
# NeoForge dev client (feasibility proven by client-sync-harness-feasibility.yml) auto-joining a
# real dedicated server over a real loopback socket via vanilla's --quickPlayMultiplayer, with a
# test-only client-side tick hook (ErosionClientSyncProbe, never active unless explicitly
# enabled) reading the actual ClientLevel -- built purely from received network packets,
# independent of whatever the server believes -- at a known position.
#
# This slice covers only the default-OFF case: erosionEnabled defaults false, so a forced
# ErosionAttempt.attempt call (via the test-only erosionclientsynctest command, never active
# unless explicitly enabled, and never a substitute for DIV's real contact-telemetry trigger
# still blocked on MINECRAFT-545) must produce Outcome.DISABLED and leave the world untouched --
# proven by what the REAL CLIENT actually reads back, not a server-side flag. The enabled/
# one-layer-conservation and rejected/canceled-unchanged cases are separate, later slices.
#
# Two separate checkouts (server-side/, client-side/) because this repo's dev runs all default
# to a single shared ./run working directory -- running client and server from the same checkout
# in the same job would collide on that one directory. Boot, interact, and shutdown all happen
# within ONE script step (this repo's established pattern in pinned-jar-smoke-acceptance.yml and
# div-replacement-stack-smoke.yml) because a background process started with `&` in one GitHub
# Actions step is not reliably available to a later, separate step.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/client-sync-acceptance.yml'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/wrapper/**'
      - 'src/**'

permissions:
  contents: read

jobs:
  default-off-client-sync-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: server-side
      - uses: actions/checkout@v4
        with:
          path: client-side

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Xvfb, a software GL renderer (Mesa llvmpipe), and screenshot tooling for the headless client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri x11-apps imagemagick xdotool

      - name: Pre-seed the server's offline-mode server.properties before first boot
        run: |
          mkdir -p server-side/run client-side/run
          echo "eula=true" > server-side/run/eula.txt
          cat > server-side/run/server.properties <<'EOF'
          online-mode=false
          server-port=25577
          level-seed=510
          spawn-protection=0
          EOF

      - name: Boot a real server and a real headless client together, drive the forced default-OFF erosion attempt, verify what the client actually observed, then stop both gracefully
        run: |
          set -o pipefail
          cd server-side
          mkfifo stdin.pipe
          exec 9<>stdin.pipe
          timeout 900 ./gradlew runServer --no-daemon -PerosionClientSyncTest=true \
            < stdin.pipe > server-boot.log 2>&1 &
          server_pid=$!
          cd ..

          for i in $(seq 1 120); do
            grep -q 'Done (' server-side/server-boot.log 2>/dev/null && break
            sleep 2
          done
          if ! grep -q 'Done (' server-side/server-boot.log; then
            echo "::error::server never reported 'Done (' -- see server-boot.log"
            cat server-side/server-boot.log
            exit 1
          fi

          # Run our own Xvfb on a known, fixed display (rather than xvfb-run's auto-picked one)
          # so a screenshot/thread-dump tool can actually target it -- direction 55083's
          # instruction: capture real evidence (screenshot + JVM thread dump of the live client
          # process) to distinguish an idle screen, a render/event-loop stall, a pending task, or
          # a connection failure, rather than guessing another flag or extending the timeout
          # again.
          Xvfb :99 -screen 0 1280x720x24 &
          xvfb_pid=$!
          sleep 2
          export DISPLAY=:99

          cd client-side
          timeout 600 ./gradlew runClient --no-daemon \
              -PerosionClientSyncProbe=true \
              -PerosionClientSyncQuickPlay=localhost:25577 \
              -PerosionClientSyncProbePos=0,-59,0 \
              -PerosionClientSyncProbeOutputFile="$(pwd)/client-probe-result.txt" \
            > client-boot.log 2>&1 &
          client_pid=$!
          cd ..

          # A prior run's screenshot (captured per direction 55083, confirming this is real
          # evidence, not a guess) showed exactly why: the client was sitting, fully rendered and
          # perfectly healthy, at vanilla's real first-run "Accessibility Settings/Narrator"
          # onboarding dialog -- a genuine one-time dialog a real human operator would click
          # through once, which blocks everything after it, including quickplay's auto-connect.
          # Dismiss it with a real simulated click at its "Continue" button (known, fixed
          # coordinates at our fixed 1280x720 resolution), the equivalent of that one-time human
          # acknowledgment, not fabricated evidence.
          #
          # A fixed `sleep 25` before the first click attempt proved mistimed on a run where
          # boot was slower -- the post-click screenshot showed the EARLY mod-loading splash
          # screen still up, not yet the dialog, so that click landed on nothing. Instead, wait
          # for the real "Loaded 0 entity animations" log line (the last line ever observed
          # before the dialog appears in every run so far), then retry the click a few times
          # with a delay -- a click on the harmless mod-loading splash does nothing, so retrying
          # is safe, and this tolerates run-to-run boot-time variance without guessing a fixed
          # sleep. No window manager runs under bare Xvfb (confirmed: windowactivate's
          # _NET_ACTIVE_WINDOW attempt errors, harmlessly, every time) so mousedown/mouseup are
          # sent directly without relying on window focus.
          for i in $(seq 1 30); do
            grep -qF 'Loaded 0 entity animations' client-side/client-boot.log 2>/dev/null && break
            sleep 2
          done
          for attempt in 1 2 3 4 5 6; do
            DISPLAY=:99 xdotool mousemove 638 567 2>>client-side/xdotool.log || true
            sleep 1
            DISPLAY=:99 xdotool mousedown 1 2>>client-side/xdotool.log || true
            sleep 1
            DISPLAY=:99 xdotool mouseup 1 2>>client-side/xdotool.log || true
            sleep 3
            xwd -root -display :99 -out /tmp/post-click-screen.xwd 2>>client-side/xwd.log \
              && convert /tmp/post-click-screen.xwd "client-side/post-click-screenshot-attempt${attempt}.png" 2>>client-side/xwd.log \
              || true
            grep -qE 'joined the game' server-side/server-boot.log 2>/dev/null && break
            sleep 7
          done

          last_client_lines=0
          diagnostics_captured=false
          for i in $(seq 1 150); do
            grep -qE 'joined the game' server-side/server-boot.log 2>/dev/null && break
            if [ $((i % 15)) -eq 0 ]; then
              current_lines=$(wc -l < client-side/client-boot.log)
              echo "diagnostic: $((i * 2))s elapsed, client-boot.log has $current_lines lines (was $last_client_lines 30s ago)"
              if [ "$current_lines" = "$last_client_lines" ] && [ "$diagnostics_captured" != "true" ] && [ "$i" -ge 45 ]; then
                echo "diagnostic: log has stopped growing -- capturing a real screenshot and JVM thread dump of the live client process now"
                xwd -root -display :99 -out /tmp/client-screen.xwd 2>client-side/xwd.log \
                  && convert /tmp/client-screen.xwd client-side/client-screenshot.png 2>>client-side/xwd.log \
                  || echo "screenshot capture failed, see client-side/xwd.log"
                java_pid=$(pgrep -f 'net.minecraft.client.main.Main' | head -1)
                if [ -n "$java_pid" ]; then
                  jstack "$java_pid" > client-side/client-thread-dump.txt 2>&1 \
                    || jcmd "$java_pid" Thread.print > client-side/client-thread-dump.txt 2>&1 \
                    || echo "thread dump failed, pid was $java_pid" > client-side/client-thread-dump.txt
                else
                  echo "could not find the client JVM pid via pgrep" > client-side/client-thread-dump.txt
                fi
                diagnostics_captured=true
              fi
              last_client_lines=$current_lines
            fi
            sleep 2
          done
          if ! grep -qE 'joined the game' server-side/server-boot.log; then
            echo "::error::no player ever joined the server after 300s -- the headless client did not connect. Full client-boot.log:"
            cat client-side/client-boot.log || true
            kill -9 "$xvfb_pid" 2>/dev/null || true
            exit 1
          fi

          # Move the just-joined player to a fixed, known absolute position so the harness never
          # has to guess or parse vanilla's natural spawn-finding logic, then place a known block
          # and force the default-OFF erosion attempt.
          printf 'tp @a 0 -60.5 0\n' > server-side/stdin.pipe
          sleep 2
          printf 'setblock 0 -59 0 minecraft:dirt\n' > server-side/stdin.pipe
          sleep 1
          printf 'erosionclientsynctest 0 -59 0 0 0\n' > server-side/stdin.pipe
          sleep 1
          tail -40 server-side/server-boot.log

          found=false
          for i in $(seq 1 60); do
            if [ -s client-side/client-probe-result.txt ]; then
              found=true
              break
            fi
            sleep 2
          done

          echo "stop" > server-side/stdin.pipe
          graceful=false
          for i in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              graceful=true
              break
            fi
            sleep 1
          done
          if [ "$graceful" != "true" ]; then
            kill -9 "$server_pid" 2>/dev/null || true
          fi
          kill -9 "$client_pid" 2>/dev/null || true
          kill -9 "$xvfb_pid" 2>/dev/null || true
          exec 9>&-
          rm -f server-side/stdin.pipe

          if [ "$found" != "true" ]; then
            echo "::error::the client never wrote a probe result -- it either never saw the target chunk or the probe did not run. client-boot.log:"
            cat client-side/client-boot.log || true
            exit 1
          fi
          observed="$(cat client-side/client-probe-result.txt)"
          echo "client observed block: $observed"
          if [ "$observed" != "minecraft:dirt" ]; then
            echo "::error::expected the real client to observe 'minecraft:dirt' unchanged (erosionEnabled defaults false), but observed '$observed'"
            exit 1
          fi
          echo "confirmed: a real, independently-connected client observed the block at (0,-59,0) is still minecraft:dirt after a forced erosion attempt with erosionEnabled defaulting to false -- genuine client-synchronization evidence of default-OFF no-mutation"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-sync-acceptance-default-off-evidence
          path: |
            server-side/server-boot.log
            client-side/client-boot.log
            client-side/client-probe-result.txt
            client-side/client-screenshot.png
            client-side/post-click-screenshot-attempt*.png
            client-side/client-thread-dump.txt
            client-side/xwd.log
            client-side/xdotool.log
          if-no-files-found: warn
