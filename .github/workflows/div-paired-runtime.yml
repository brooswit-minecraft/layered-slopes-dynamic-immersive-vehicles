name: DIV paired-runtime check (opt-in)

# Opt-in: never runs on an ordinary push, and only runs on a pull_request when THIS workflow
# file itself changed (so the experiment can be validated before merge without merging merely
# to unlock workflow_dispatch -- review 54853/54854 -- and without running this expensive job on
# every ordinary PR). workflow_dispatch becomes available once this file exists on main.
#
# MINECRAFT-510's actual DIV dependency is a fresh local build (DIV ships no stable release to
# pin by version/sha512), so this is the one place that build happens at all, and is the
# "untested environment where DIV's own equivalent build succeeds" (direction, comment 54843) --
# this mod's own local sandbox could not reliably do a fresh NeoForge decompile/recompile at
# all, regardless of version, so the question moved here rather than more local retries.
on:
  workflow_dispatch:
    inputs:
      divRef:
        description: 'DIV commit/branch/tag to build against'
        required: true
        # MINECRAFT-510 (direction comment 55238/M55554611): DIV main after merging PR #54,
        # the generic WheelGroundContactEvent telemetry seam this mod's new divIntegration
        # sourceSet (build.gradle, src/divIntegration/**) now compiles against. Bumped from the
        # prior pin (958e645) specifically so this job exercises the real, merged event class.
        default: '90893694e79b2fecd959153ff70d627418d2aa1c'
  pull_request:
    paths:
      - '.github/workflows/div-paired-runtime.yml'
      - 'build.gradle'
      - 'gradle.properties'
      - 'src/divIntegration/**'
      - 'src/main/java/io/github/brooswitminecraft/layeredslopesdynamicimmersivevehicles/erosion/ErosionWheelContactIntegration.java'

permissions:
  contents: read

jobs:
  paired-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: compat

      - name: Check out DIV at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/dynamic-immersive-vehicles
          # workflow_dispatch lets the caller pick a ref; a plain pull_request run (this
          # workflow file's own validation path) always uses the known-good default commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.divRef || '90893694e79b2fecd959153ff70d627418d2aa1c' }}
          path: div

      - name: Record the actual DIV commit checked out
        id: divcommit
        working-directory: div
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Matches DIV's own ci.yml exactly (no committed wrapper there) so this is the same,
      # already-proven toolchain, not a fresh guess.
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'

      - name: Build DIV
        working-directory: div
        run: gradle --no-daemon --stacktrace clean build -x test

      - name: Verify the exact expected DIV jar exists (not just "some jar")
        id: divjar
        working-directory: div
        run: |
          expected="build/libs/dynamic-immersive-vehicles-0.1.0-SNAPSHOT.jar"
          if [ ! -f "$expected" ]; then
            echo "::error::expected DIV artifact '$expected' was not produced -- found instead:"
            ls -la build/libs/ || true
            exit 1
          fi
          actual_count=$(find build/libs -maxdepth 1 -name '*.jar' | wc -l)
          if [ "$actual_count" -ne 1 ]; then
            echo "::error::expected exactly 1 jar under build/libs, found $actual_count:"
            ls -la build/libs/
            exit 1
          fi
          echo "path=$(readlink -f "$expected")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$expected" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build this mod against DIV + its own required dependencies (mts, Sable, Sable Companion)
        working-directory: compat
        run: |
          ./gradlew build --no-daemon \
            "-PdivLocalJar=${{ steps.divjar.outputs.path }}" \
            -PpairedRuntime=true \
            -Pneo_version=21.1.265

      - name: Boot a real dedicated server with DIV, this mod, and every DIV-required dependency loaded
        working-directory: compat
        run: |
          set -o pipefail
          # -Pneo_version=21.1.265 overrides the ordinary default (21.1.250) for this paired job
          # only: DIV's own neoforge.mods.toml requires >=21.1.265 to boot at all, which this
          # mod's own default build-time floor is deliberately NOT raised to match (see
          # gradle.properties) -- a real GitHub Actions runner, unlike this project's earlier
          # local-sandbox toolchain failures at that exact version, is the actual place this can
          # be tested.
          ./gradlew runGameTestServer --no-daemon \
            "-PdivLocalJar=${{ steps.divjar.outputs.path }}" \
            -PpairedRuntime=true \
            -Pneo_version=21.1.265 \
            2>&1 | tee paired-runtime-boot.log
          # StandaloneBootGameTests.theGameTestHarnessBootsForThisMod is a real, passing test as
          # of this slice -- this now has a genuine successful terminal result to require,
          # rather than the guaranteed-nonzero "No test functions were given!" a zero-test
          # runGameTestServer always produces (review 54853/54854).
          python3 scripts/check_gametest_count.py paired-runtime-boot.log 24

      - name: Verify every DIV-required mod actually loaded (not just this mod's own test passing)
        working-directory: compat
        run: |
          echo "--- Mod List from the boot log ---"
          sed -n '/Mod List:/,/^\s*$/p' paired-runtime-boot.log
          for modid in layeredslopesdynamicimmersivevehicles layeredslopes layeredslopegrading dynamicimmersivevehicles mts sable sablecompanion; do
            if ! grep -q "($modid)" paired-runtime-boot.log; then
              echo "::error::expected mod id '$modid' not found in the boot log's Mod List"
              exit 1
            fi
          done
          if ! grep -qi "Found 0 mod requirements missing (0 mandatory, 0 optional)" paired-runtime-boot.log; then
            echo "::error::did not find the expected '0 mod requirements missing' line -- a dependency failed to resolve"
            exit 1
          fi
          echo "0 missing mod requirements confirmed, all 7 expected mod ids present"

      - name: Record an immutable resolved-dependency manifest
        if: always()
        working-directory: compat
        run: |
          {
            echo "# DIV paired-runtime manifest -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_os=$(uname -a)"
            echo "java_version=$(java -version 2>&1 | head -n1)"
            echo "gradle_version=$(./gradlew --version 2>&1 | grep '^Gradle')"
            echo "neo_version_requested=21.1.265"
            echo "div_commit=${{ steps.divcommit.outputs.sha }}"
            echo "div_jar=dynamic-immersive-vehicles-0.1.0-SNAPSHOT.jar"
            echo "div_jar_sha256=${{ steps.divjar.outputs.sha256 }}"
            echo "layeredslopes_version=$(grep '^layeredslopes_version=' gradle.properties | cut -d= -f2)"
            echo "layeredslopes_sha512=$(grep '^layeredslopes_sha512=' gradle.properties | cut -d= -f2)"
            echo "layeredslopegrading_version=$(grep '^layeredslopegrading_version=' gradle.properties | cut -d= -f2)"
            echo "layeredslopegrading_sha512=$(grep '^layeredslopegrading_sha512=' gradle.properties | cut -d= -f2)"
            echo "--- resolved paired-runtime dependencies (exact coordinates this build.gradle declared, not a cache-wide glob) ---"
            ./gradlew pairedRuntimeManifest --no-daemon --console=plain \
              "-PdivLocalJar=${{ steps.divjar.outputs.path }}" \
              -PpairedRuntime=true \
              -Pneo_version=21.1.265 2>&1 | grep -E '^(curse\.maven|dev\.ryanhcode)' || echo "(no paired-runtime dependencies resolved -- see full task output on failure)"
          } > paired-runtime-manifest.txt
          cat paired-runtime-manifest.txt

      - name: Upload the boot log and resolved-dependency manifest regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: div-paired-runtime-evidence
          path: |
            compat/paired-runtime-boot.log
            compat/paired-runtime-manifest.txt
          if-no-files-found: warn
