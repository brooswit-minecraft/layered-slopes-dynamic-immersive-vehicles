name: Pinned-jar smoke acceptance (opt-in)

# Opt-in: never runs on an ordinary push, and only runs on a pull_request when THIS workflow
# file itself changed, or build.gradle/gradle.properties (the pinned versions/sha512s) change.
# Direction (comment 54997/55004): "prove base DIV and Layered Slopes boot without compat/no
# mutual linkage, and prove replacement stack boots with packaged compat where applicable, not
# just source-set dev classpath."
#
# Every other GameTest-based check in this repo (build/release-gate, dt-paired-runtime.yml,
# dependency-failure-acceptance.yml, incompatible-version-acceptance.yml) boots via NeoForge's
# moddev Gradle plugin's dev-mode gameTestServer run, which loads this mod straight off its
# source-set classpath, never the actual packaged jar a real server would run. This workflow is
# the one place that builds the REAL jar (`./gradlew jar`), installs a REAL, genuine,
# NeoForge-installer-produced dedicated-server distribution (the same kind an actual operator
# would download and run), and boots it with the real packaged jars dropped in `mods/` --
# proving the whole distributable artifact works end to end, not just the dev harness.
#
# `replacement-stack-smoke`: this mod's own packaged jar + the pinned layered-slopes/
# layered-slope-grading release jars together -- the "replacement stack."
# `base-mods-isolation-smoke`: layered-slopes + layered-slope-grading ALONE, with this mod's jar
# deliberately absent -- proving neither depends on this compat mod and both boot standalone.
# `missing-div-isolation-smoke` (direction comment 55286): this mod's own packaged jar, built by
# the EXACT same recipe ci.yml uses (DIV built fresh from the pinned source commit, then
# `-PdivLocalJar` pointed at it, so the real META-INF/services provider metadata is genuinely
# baked in -- never a separately rebuilt DIV-free variant) + the pinned base mods, booted with
# DIV's OWN jar deliberately never installed -- proving the real shipped artifact still boots
# cleanly and registers 0 wheel-contact integrations when DIV is genuinely absent at runtime,
# rather than crashing on a LinkageError trying to link a provider whose own types aren't on the
# classpath.
#
# No GameTests run here at all (a real production server has no GameTest harness); success
# evidence is the real "Done (" startup line plus the real Mod List naming exactly the expected
# mod ids, the same discipline dependency-failure-acceptance.yml/incompatible-version-acceptance.yml
# established: never trust a bare process exit code alone.
#
# Review 55013's required changes: shutdown is now sent as a REAL stdin "stop" command (via a
# named pipe kept open so later writes never block), with a bounded wait for the process to exit
# ON ITS OWN -- a SIGKILL is only ever a documented fallback, never the primary evidence, and the
# real vanilla/NeoForge shutdown log lines (Stopping server/Saving worlds/All dimensions are
# saved) are asserted too. `replacement-stack-smoke` also asserts the real generated
# `layeredslopesdynamicimmersivevehicles-server.toml` actually defaults `erosionEnabled` to
# `false` -- not assumed from the source code, read from the file the real packaged jar
# genuinely wrote. This slice still does NOT install or boot DIV at all. Per review 55019: "no
# stable, pinnable DIV release" is NOT itself a blocker for that -- div-paired-runtime.yml
# already builds DIV fresh from a verified, pinned commit SHA for its own paired-runtime check,
# and a future slice should reuse that same source-build pipeline here. DIV-alone/base-DIV
# isolation and the full DIV replacement stack remain an open next CI slice, not blocked on a
# nonexistent public release; see README.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pinned-jar-smoke-acceptance.yml'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/wrapper/**'
      - 'src/**'

permissions:
  contents: read

jobs:
  replacement-stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build this mod's real packaged jar, and download+verify the pinned base-mod jars
        run: ./gradlew jar downloadLayeredSlopes downloadLayeredSlopeGrading --no-daemon

      - name: Install a real NeoForge dedicated-server distribution
        run: |
          neo_version=$(grep '^neo_version=' gradle.properties | cut -d= -f2)
          mkdir server && cd server
          curl -sL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${neo_version}/neoforge-${neo_version}-installer.jar"
          java -jar installer.jar --installServer
          echo "eula=true" > eula.txt
          mkdir mods

      - name: Drop the real packaged mod jar and the pinned base-mod jars into mods/
        run: |
          mod_jar=$(ls build/libs/*.jar | head -1)
          cp "$mod_jar" server/mods/
          cp build/layeredslopes/*.jar server/mods/
          cp build/layeredslopegrading/*.jar server/mods/
          ls -la server/mods/

      - name: Boot the real distribution with the real packaged replacement stack, then stop it gracefully
        working-directory: server
        run: |
          set -o pipefail
          mkfifo stdin.pipe
          exec 9<>stdin.pipe
          timeout 150 ./run.sh --nogui < stdin.pipe > boot.log 2>&1 &
          boot_pid=$!
          for i in $(seq 1 60); do
            if grep -qE 'Done \(|FAILED TO START|ModLoadingException|Failed to start' boot.log 2>/dev/null; then
              break
            fi
            sleep 2
          done
          # Real graceful shutdown via the server's own stdin "stop" command (not a signal) --
          # review 55013's exact point: a bare pkill -9 is not evidence of clean shutdown.
          echo "stop" > stdin.pipe
          graceful=false
          for i in $(seq 1 30); do
            if ! kill -0 "$boot_pid" 2>/dev/null; then
              graceful=true
              break
            fi
            sleep 1
          done
          if [ "$graceful" != "true" ]; then
            echo "::warning::server did not exit on its own within 30s of 'stop' -- force killing as a fallback, cleanup evidence below will reflect this"
            kill -9 "$boot_pid" 2>/dev/null || true
          fi
          exec 9>&-
          rm -f stdin.pipe
          echo "graceful=${graceful}" > shutdown-status.txt
          cat boot.log

      - name: Verify a real, successful boot naming exactly the expected mod ids, a graceful shutdown, and the real default-OFF erosionEnabled config
        working-directory: server
        run: |
          if ! grep -q 'Done (' boot.log; then
            echo "::error::expected a real 'Done (' startup line -- the server did not boot successfully"
            exit 1
          fi
          for modid in '(layeredslopes)' '(layeredslopegrading)' '(layeredslopesdynamicimmersivevehicles)'; do
            if ! grep -qF "$modid" boot.log; then
              echo "::error::expected '$modid' in the real Mod List, not found"
              exit 1
            fi
          done
          if ! grep -qF 'graceful=true' shutdown-status.txt; then
            echo "::error::the server did not exit on its own within 30s of the real stdin 'stop' command -- this is not evidence of clean shutdown"
            exit 1
          fi
          # Review 55015's exact point: the original single-alternation grep passed when only
          # ONE of the three markers was present. Require all three independently.
          for marker in 'Stopping server' 'Saving worlds' 'All dimensions are saved'; do
            if ! grep -qF "$marker" boot.log; then
              echo "::error::expected the real vanilla/NeoForge graceful-shutdown log line '$marker' -- not found"
              exit 1
            fi
          done
          config="config/layeredslopesdynamicimmersivevehicles-server.toml"
          if [ ! -f "$config" ]; then
            echo "::error::expected the real generated config file at $config -- it was never written"
            exit 1
          fi
          if ! grep -qE '^erosionEnabled\s*=\s*false' "$config"; then
            echo "::error::expected the real generated config to default erosionEnabled to false, got:"
            cat "$config"
            exit 1
          fi
          echo "confirmed: the real packaged replacement stack booted successfully with all 3 expected mod ids, shut down gracefully via a real stdin 'stop' command, and its real generated config defaults erosionEnabled to false"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replacement-stack-smoke-evidence
          path: |
            server/boot.log
            server/shutdown-status.txt
            server/config/layeredslopesdynamicimmersivevehicles-server.toml
          if-no-files-found: warn

  base-mods-isolation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Download+verify the pinned base-mod jars (this mod's own jar is deliberately NOT built here)
        run: ./gradlew downloadLayeredSlopes downloadLayeredSlopeGrading --no-daemon

      - name: Install a real NeoForge dedicated-server distribution
        run: |
          neo_version=$(grep '^neo_version=' gradle.properties | cut -d= -f2)
          mkdir server && cd server
          curl -sL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${neo_version}/neoforge-${neo_version}-installer.jar"
          java -jar installer.jar --installServer
          echo "eula=true" > eula.txt
          mkdir mods

      - name: Drop ONLY the pinned base-mod jars into mods/ -- this compat mod is deliberately absent
        run: |
          cp build/layeredslopes/*.jar server/mods/
          cp build/layeredslopegrading/*.jar server/mods/
          ls -la server/mods/

      - name: Boot the real distribution with ONLY the base mods, no compat mod at all, then stop it gracefully
        working-directory: server
        run: |
          set -o pipefail
          mkfifo stdin.pipe
          exec 9<>stdin.pipe
          timeout 150 ./run.sh --nogui < stdin.pipe > boot.log 2>&1 &
          boot_pid=$!
          for i in $(seq 1 60); do
            if grep -qE 'Done \(|FAILED TO START|ModLoadingException|Failed to start' boot.log 2>/dev/null; then
              break
            fi
            sleep 2
          done
          echo "stop" > stdin.pipe
          graceful=false
          for i in $(seq 1 30); do
            if ! kill -0 "$boot_pid" 2>/dev/null; then
              graceful=true
              break
            fi
            sleep 1
          done
          if [ "$graceful" != "true" ]; then
            echo "::warning::server did not exit on its own within 30s of 'stop' -- force killing as a fallback, cleanup evidence below will reflect this"
            kill -9 "$boot_pid" 2>/dev/null || true
          fi
          exec 9>&-
          rm -f stdin.pipe
          echo "graceful=${graceful}" > shutdown-status.txt
          cat boot.log

      - name: Verify a real, successful standalone boot with no mutual dependency on this compat mod, and a graceful shutdown
        working-directory: server
        run: |
          if ! grep -q 'Done (' boot.log; then
            echo "::error::expected a real 'Done (' startup line -- layered-slopes/layered-slope-grading did not boot standalone successfully"
            exit 1
          fi
          for modid in '(layeredslopes)' '(layeredslopegrading)'; do
            if ! grep -qF "$modid" boot.log; then
              echo "::error::expected '$modid' in the real Mod List, not found"
              exit 1
            fi
          done
          if grep -qF '(layeredslopesdynamicimmersivevehicles)' boot.log; then
            echo "::error::found this compat mod's own modid in the Mod List, but its jar was deliberately never placed in mods/ -- something is wrong with this job's isolation"
            exit 1
          fi
          if ! grep -qF 'graceful=true' shutdown-status.txt; then
            echo "::error::the server did not exit on its own within 30s of the real stdin 'stop' command -- this is not evidence of clean shutdown"
            exit 1
          fi
          # Review 55015's exact point: the original single-alternation grep passed when only
          # ONE of the three markers was present. Require all three independently.
          for marker in 'Stopping server' 'Saving worlds' 'All dimensions are saved'; do
            if ! grep -qF "$marker" boot.log; then
              echo "::error::expected the real vanilla/NeoForge graceful-shutdown log line '$marker' -- not found"
              exit 1
            fi
          done
          echo "confirmed: layered-slopes and layered-slope-grading boot successfully standalone, with no dependency on this compat mod, and shut down gracefully via a real stdin 'stop' command"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-mods-isolation-smoke-evidence
          path: |
            server/boot.log
            server/shutdown-status.txt
          if-no-files-found: warn

  # Review finding (MINECRAFT-510, direction comment 55286): "run missing-DIV/isolation against
  # the exact uploaded production jar, not a separately rebuilt DIV-free variant." ci.yml's own
  # "Build and test" step now ALWAYS builds this mod's jar with DIV present (direction comment
  # 55251), so its own META-INF/services provider metadata is unconditionally baked in -- the
  # "ServiceLoader finds zero providers" claim no longer holds by omission, only by this mod's
  # own entry point now catching the real per-provider LinkageError/ServiceConfigurationError
  # when DIV's own jar is absent at runtime. This job proves THAT, not a hypothetical: builds
  # this mod's real jar via the exact same recipe ci.yml uses (DIV built fresh from the pinned
  # source commit, then `-PdivLocalJar` pointed at it -- so the provider metadata really is
  # baked in, never a separately rebuilt DIV-free variant), then boots a real dedicated server
  # with that jar but WITHOUT DIV's own jar (or its required mts/Sable/Sable-Companion
  # dependencies) ever placed in mods/.
  missing-div-isolation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: compat

      - name: Read the pinned DIV ref from gradle.properties
        id: divpin
        working-directory: compat
        run: echo "ref=$(grep '^div_pinned_ref=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Check out DIV at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/dynamic-immersive-vehicles
          ref: ${{ steps.divpin.outputs.ref }}
          path: div

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle 8.8 (DIV's own proven toolchain, matches its ci.yml)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'

      - name: Build DIV from the pinned source commit
        working-directory: div
        run: gradle --no-daemon --stacktrace clean build -x test

      - name: Verify exactly one DIV jar was produced
        id: divjar
        run: |
          expected="div/build/libs/dynamic-immersive-vehicles-0.1.0-SNAPSHOT.jar"
          if [ ! -f "$expected" ]; then
            echo "::error::expected DIV artifact '$expected' was not produced -- found instead:"
            ls -la div/build/libs/ || true
            exit 1
          fi
          actual_count=$(find div/build/libs -maxdepth 1 -name '*.jar' | wc -l)
          if [ "$actual_count" -ne 1 ]; then
            echo "::error::expected exactly 1 jar under div/build/libs, found $actual_count:"
            ls -la div/build/libs/
            exit 1
          fi
          echo "path=$(readlink -f "$expected")" >> "$GITHUB_OUTPUT"

      - name: Build this mod's real packaged jar WITH DIV present (the exact recipe ci.yml uses), and download+verify the pinned base-mod jars
        working-directory: compat
        run: ./gradlew jar downloadLayeredSlopes downloadLayeredSlopeGrading --no-daemon "-PdivLocalJar=${{ steps.divjar.outputs.path }}"

      - name: Verify the built jar actually bundles the DIV integration provider (not a DIV-free variant)
        working-directory: compat
        run: |
          mod_jar=$(ls build/libs/*.jar | head -1)
          if ! unzip -l "$mod_jar" | grep -q 'META-INF/services/io.github.brooswitminecraft.layeredslopesdynamicimmersivevehicles.erosion.ErosionWheelContactIntegration'; then
            echo "::error::built jar does not bundle the DIV wheel-contact provider metadata -- this job would otherwise be testing a non-representative DIV-free variant, not the real shipped artifact"
            exit 1
          fi
          echo "confirmed: the built jar bundles the real DIV wheel-contact provider metadata, same as the real artifact ci.yml uploads"

      - name: Install a real NeoForge dedicated-server distribution
        working-directory: compat
        run: |
          neo_version=$(grep '^neo_version=' gradle.properties | cut -d= -f2)
          mkdir server && cd server
          curl -sL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${neo_version}/neoforge-${neo_version}-installer.jar"
          java -jar installer.jar --installServer
          echo "eula=true" > eula.txt
          mkdir mods

      - name: Drop this mod's real jar and the base-mod jars into mods/ -- DIV's own jar is deliberately NEVER installed
        working-directory: compat
        run: |
          mod_jar=$(ls build/libs/*.jar | head -1)
          cp "$mod_jar" server/mods/
          cp build/layeredslopes/*.jar server/mods/
          cp build/layeredslopegrading/*.jar server/mods/
          ls -la server/mods/

      - name: Boot the real distribution with this mod's real jar but DIV genuinely absent, then stop it gracefully
        working-directory: compat/server
        run: |
          set -o pipefail
          mkfifo stdin.pipe
          exec 9<>stdin.pipe
          timeout 150 ./run.sh --nogui < stdin.pipe > boot.log 2>&1 &
          boot_pid=$!
          for i in $(seq 1 60); do
            if grep -qE 'Done \(|FAILED TO START|ModLoadingException|Failed to start' boot.log 2>/dev/null; then
              break
            fi
            sleep 2
          done
          echo "stop" > stdin.pipe
          graceful=false
          for i in $(seq 1 30); do
            if ! kill -0 "$boot_pid" 2>/dev/null; then
              graceful=true
              break
            fi
            sleep 1
          done
          if [ "$graceful" != "true" ]; then
            echo "::warning::server did not exit on its own within 30s of 'stop' -- force killing as a fallback, cleanup evidence below will reflect this"
            kill -9 "$boot_pid" 2>/dev/null || true
          fi
          exec 9>&-
          rm -f stdin.pipe
          echo "graceful=${graceful}" > shutdown-status.txt
          cat boot.log

      - name: Verify a real, successful boot with DIV's provider metadata present but DIV itself genuinely absent, no crash, graceful shutdown
        working-directory: compat/server
        run: |
          if ! grep -q 'Done (' boot.log; then
            echo "::error::expected a real 'Done (' startup line -- the server did not boot successfully with DIV absent"
            exit 1
          fi
          if grep -qE 'FAILED TO START|ModLoadingException|Failed to start' boot.log; then
            echo "::error::found a real mod-loading failure marker -- this mod's jar must boot cleanly even though its own baked-in provider metadata names a DIV class that is not actually on this server's classpath"
            exit 1
          fi
          for modid in '(layeredslopes)' '(layeredslopegrading)' '(layeredslopesdynamicimmersivevehicles)'; do
            if ! grep -qF "$modid" boot.log; then
              echo "::error::expected '$modid' in the real Mod List, not found"
              exit 1
            fi
          done
          if grep -qF '(dynamicimmersivevehicles)' boot.log; then
            echo "::error::found DIV's own modid in the Mod List, but its jar was deliberately never installed -- something is wrong with this job's isolation"
            exit 1
          fi
          if ! grep -qF 'wheel-contact integrations registered: 0' boot.log; then
            echo "::error::expected the real entry point's own log line reporting 0 registered wheel-contact integrations -- either the graceful-skip path did not run, or it silently registered something it should not have"
            exit 1
          fi
          if ! grep -qF 'graceful=true' shutdown-status.txt; then
            echo "::error::the server did not exit on its own within 30s of the real stdin 'stop' command -- this is not evidence of clean shutdown"
            exit 1
          fi
          for marker in 'Stopping server' 'Saving worlds' 'All dimensions are saved'; do
            if ! grep -qF "$marker" boot.log; then
              echo "::error::expected the real vanilla/NeoForge graceful-shutdown log line '$marker' -- not found"
              exit 1
            fi
          done
          echo "confirmed: this mod's real jar (with DIV's provider metadata baked in) boots cleanly with DIV genuinely absent, registers 0 wheel-contact integrations, and shuts down gracefully"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-div-isolation-smoke-evidence
          path: |
            compat/server/boot.log
            compat/server/shutdown-status.txt
          if-no-files-found: warn
