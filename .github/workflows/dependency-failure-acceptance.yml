name: Dependency-failure acceptance (opt-in)

# Opt-in: never runs on an ordinary push, and only runs on a pull_request when THIS workflow
# file itself changed (same shape as div-paired-runtime.yml/dt-paired-runtime.yml). Proves
# NeoForge's own mandatory-dependency check actually refuses to boot, with a meaningful message
# naming the specific missing mod, when a required dependency's jar is absent at runtime -- not
# merely that some process exits nonzero (direction, comment 54973). See build.gradle's
# omitRequiredDependency flag: compileOnly stays so main code still compiles; only the
# runtimeOnly entry for the named mod is skipped, so neoforge.mods.toml's own
# type="required" declaration for it is genuinely unmet.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/dependency-failure-acceptance.yml'
      - 'build.gradle'

permissions:
  contents: read

jobs:
  missing-layeredslopes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Boot with layeredslopes deliberately missing at runtime -- must fail, meaningfully
        run: |
          set -o pipefail
          if ./gradlew runGameTestServer --no-daemon -PomitRequiredDependency=layeredslopes \
               2>&1 | tee missing-layeredslopes.log; then
            echo "::error::expected this boot to FAIL (layeredslopes is deliberately missing), but it succeeded"
            exit 1
          fi
          echo "boot failed as expected (exit nonzero) -- checking for a MEANINGFUL message naming the missing mod"

      - name: Verify the failure actually names layeredslopes as missing (not just any crash)
        run: |
          if ! grep -qi 'layeredslopes' missing-layeredslopes.log; then
            echo "::error::the boot failed, but nothing in the log names 'layeredslopes' -- this is not evidence the failure is actually about the missing dependency, just that something crashed"
            exit 1
          fi
          echo "confirmed: failure log names layeredslopes"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-layeredslopes-evidence
          path: missing-layeredslopes.log
          if-no-files-found: warn

  missing-layeredslopegrading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Boot with layeredslopegrading deliberately missing at runtime -- must fail, meaningfully
        run: |
          set -o pipefail
          if ./gradlew runGameTestServer --no-daemon -PomitRequiredDependency=layeredslopegrading \
               2>&1 | tee missing-layeredslopegrading.log; then
            echo "::error::expected this boot to FAIL (layeredslopegrading is deliberately missing), but it succeeded"
            exit 1
          fi
          echo "boot failed as expected (exit nonzero) -- checking for a MEANINGFUL message naming the missing mod"

      - name: Verify the failure actually names layeredslopegrading as missing (not just any crash)
        run: |
          if ! grep -qi 'layeredslopegrading' missing-layeredslopegrading.log; then
            echo "::error::the boot failed, but nothing in the log names 'layeredslopegrading' -- this is not evidence the failure is actually about the missing dependency, just that something crashed"
            exit 1
          fi
          echo "confirmed: failure log names layeredslopegrading"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-layeredslopegrading-evidence
          path: missing-layeredslopegrading.log
          if-no-files-found: warn
