modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="brooswit"
description='''Dedicated traction-loss erosion compatibility mod between Dynamic Immersive Vehicles and Layered Slopes, via Layered Slope Grading.'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Layered Slopes provides the layered block family the erosion consumer will ultimately touch,
# indirectly through layered-slope-grading's Smoothing service.
[[dependencies.${mod_id}]]
    modId="layeredslopes"
    type="required"
    versionRange="[${layeredslopes_version},)"
    ordering="AFTER"
    side="BOTH"

# Layered Slope Grading provides the Smoothing.smooth/canSmooth service and the
# SmoothingAuthorizationEvent protection seam this mod's erosion consumer will call -- never
# LayeredBlock/LayerMath directly (MINECRAFT-555 prep packet, comment 54607).
[[dependencies.${mod_id}]]
    modId="layeredslopegrading"
    type="required"
    versionRange="[${layeredslopegrading_version},)"
    ordering="AFTER"
    side="BOTH"

# Dynamic Immersive Vehicles: optional, not required -- this mod's other two consumers
# (erosion's own config/policy and the layered-slopes/layered-slope-grading integration) remain
# fully standalone of DIV. The real contact-telemetry consumer (MINECRAFT-510, direction comment
# 55238/M55554611) lives in src/divIntegration, discovered at runtime via a ServiceLoader seam
# that registers zero providers (a graceful no-op, not an error) when DIV is absent -- so this
# entry only tells NeoForge "load AFTER DIV if DIV happens to be present," never "fail to load
# without it." No real DIV release version exists yet to pin a versionRange against (see
# build.gradle/gradle.properties' div_pinned_ref for how this mod's own build instead pins DIV
# by source commit, an immutable git SHA); versionRange is left maximally permissive until DIV
# ships one.
[[dependencies.${mod_id}]]
    modId="dynamicimmersivevehicles"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
