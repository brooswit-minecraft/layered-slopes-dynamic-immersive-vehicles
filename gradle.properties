# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# You can find the latest versions here: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact.
# DIV's own neoforge.mods.toml floor is versionRange="[21.1.265,)" (re-verified against the live
# dynamic-immersive-vehicles main branch at pickup, MINECRAFT-510) -- that is DIV's OWN required
# floor for users installing DIV, not a requirement that THIS mod's build-time neo_version match
# it exactly: a user's installed NeoForge satisfying DIV's higher floor also satisfies this
# mod's lower one below.
#
# Root-caused, not guessed past: with neo_version=21.1.265, `:createMinecraftArtifacts` fails
# before this mod's own sources are ever touched -- confirmed from the --info log's exact
# subprocess command line (neoform-runtime-2.0.31-all.jar run --neoforge
# net.neoforged:neoforge:21.1.265:userdev ...), invoked with the SAME local JDK
# (/usr/lib/jvm/java-21-openjdk-amd64) as the working 21.1.250 run. The failure
# ("IllegalArgumentException: error: release version 21 not supported" from
# RecompileSourcesActionWithJDK, recompiling NeoForge's OWN decompiled 1.21.1 source tree) is
# reproducible on 21.1.265 and absent on 21.1.250 with every other variable held constant --
# an upstream NeoForge-21.1.265/neoform-runtime-2.0.31 incompatibility, not a hypothesis about a
# wrong local compiler selection (that was checked and ruled out: identical JDK both times).
neo_version=21.1.250
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=layeredslopesdynamicimmersivevehicles
# The human-readable display name for the mod.
mod_name=Layered Slopes Dynamic Immersive Vehicles
# The license of the mod. Review your options at https://choosealicense.com/.
mod_license=MIT
# The group ID for the mod. Matches the base package used for the mod sources, the same
# io.github.brooswitminecraft group convention every sibling compat mod in this org uses.
mod_group_id=io.github.brooswitminecraft

# layered-slopes compileOnly+runtimeOnly dependency, pinned by version and verified by sha512 --
# same pattern layered-slopes-flowing-fluids and layered-slope-dynamic-paths use for this exact
# dependency. See build.gradle's downloadLayeredSlopes task.
layeredslopes_version=0.2.0
layeredslopes_sha512=a4189fa84d0f99fe4ae0a2d219a7322376e66ea9def5e2ba6a2486e9e616b3bd2853444605c83bb037c7ab336634c1bf896108dfe5b3b8516256c5ff70e336e1

# layered-slope-grading compileOnly+runtimeOnly dependency: this mod's erosion consumer calls its
# public Smoothing.smooth/canSmooth service rather than touching LayeredBlock/LayerMath directly
# (MINECRAFT-555 prep packet, comment 54607). Pinned by version and verified by sha512, same
# download-and-verify pattern as layeredslopes_version above.
layeredslopegrading_version=0.2.0
# Verified independently (curl + sha512sum against the real GitHub release asset, not copied
# blind from a sibling repo's gradle.properties). Bumped from the stale v0.1.0 pin (review 54899):
# v0.1.0 predates SmoothingAuthorizationEvent entirely (confirmed via `unzip -l` on the actual
# release jar, not just the source tag) -- this mod's protection design depends on that event
# firing inside Smoothing.smooth(), so staying on v0.1.0 would have meant it never fires at all
# against the real pinned dependency, regardless of anything ErosionProtectionGate/
# SmoothingScopeProtectionAdapter does. v0.2.0 is the exact version that first includes it.
layeredslopegrading_sha512=d9c3178d5a0accda1be42bf2e3998d48c4c9f3a8249524e317af15215003c16397d2ffe636d5770dfc9b5f2a32d67a931bb35d116c141cacf853ed41be6323aa

# dynamic-immersive-vehicles compileOnly+runtimeOnly dependency: DIV currently ships NO stable,
# sha512-pinnable GitHub Release (verified at pickup -- `gh release list` on that repo returns
# only private "not for publishing" draft test-builds, never a real release asset). Until DIV
# cuts one, this mod cannot resolve a real pinned div_version/div_sha512 release-asset pair the
# way it does for layered-slopes/layered-slope-grading above -- these two stay UNRELEASED
# placeholders for that future mechanism. `-PdivLocalJar=<path>` remains the override for local
# dev / paired-PR integration validation against a manually-built DIV jar.
div_version=UNRELEASED
div_sha512=UNRELEASED

# Interim pin while div_version/div_sha512 above stay UNRELEASED (direction, comment 55251:
# "DIV's missing public release does not prevent an immutable source-pinned dependency build and
# verified jar hashing, already exercised by paired CI. Choose a reproducible supported
# build/package path that includes this production consumer in the intended ordinary
# deliverable"): pins DIV by exact source commit instead of a release version, and the jar
# ci.yml builds from that commit must hash to this exact sha256 or the build fails closed.
# div_pinned_jar_sha256 is NOT guessed -- it is the real sha256 div-paired-runtime.yml's own
# "Verify the exact expected DIV jar exists" step independently computed and recorded, pulled
# from that run's own uploaded div-paired-runtime-evidence/paired-runtime-manifest.txt artifact
# (run 44432154528, job 135251967986, div_commit=90893694e79b2fecd959153ff70d627418d2aa1c).
div_pinned_ref=90893694e79b2fecd959153ff70d627418d2aa1c
div_pinned_jar_sha256=4e7c08c30af730af1192399e7c9af9a689a09ff8de24003237f78cc3a0bc9b29

# Shipped version placeholder. Read by the release gate; never edited by hand in a PR. The real
# shipped version lives in git tags, computed by the release workflow from changelog.d fragments
# and passed to the build via `-Pmod_version=...` -- this file's value is never rewritten.
version=0.0.0
