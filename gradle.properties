# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# You can find the latest versions here: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact.
# Matches DIV's own neoforge.mods.toml floor (versionRange="[21.1.265,)"), re-verified against
# the live dynamic-immersive-vehicles main branch at pickup (MINECRAFT-510).
neo_version=21.1.265
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=layeredslopesdynamicimmersivevehicles
# The human-readable display name for the mod.
mod_name=Layered Slopes Dynamic Immersive Vehicles
# The license of the mod. Review your options at https://choosealicense.com/.
mod_license=MIT
# The group ID for the mod. Matches the base package used for the mod sources, the same
# io.github.brooswitminecraft group convention every sibling compat mod in this org uses.
mod_group_id=io.github.brooswitminecraft

# layered-slopes compileOnly+runtimeOnly dependency, pinned by version and verified by sha512 --
# same pattern layered-slopes-flowing-fluids and layered-slope-dynamic-paths use for this exact
# dependency. See build.gradle's downloadLayeredSlopes task.
layeredslopes_version=0.2.0
layeredslopes_sha512=a4189fa84d0f99fe4ae0a2d219a7322376e66ea9def5e2ba6a2486e9e616b3bd2853444605c83bb037c7ab336634c1bf896108dfe5b3b8516256c5ff70e336e1

# layered-slope-grading compileOnly+runtimeOnly dependency: this mod's erosion consumer calls its
# public Smoothing.smooth/canSmooth service rather than touching LayeredBlock/LayerMath directly
# (MINECRAFT-555 prep packet, comment 54607). Pinned by version and verified by sha512, same
# download-and-verify pattern as layeredslopes_version above.
layeredslopegrading_version=0.1.0
# PLACEHOLDER -- fill in with the real published asset sha512 before the build.gradle download
# task actually depends on this value (see downloadLayeredSlopeGrading task's own guard, once
# that integration lands in a later slice of this ticket's bounded sequence).
layeredslopegrading_sha512=UNRELEASED

# dynamic-immersive-vehicles compileOnly+runtimeOnly dependency: DIV currently ships NO stable,
# sha512-pinnable GitHub Release (verified at pickup -- `gh release list` on that repo returns
# only private "not for publishing" draft test-builds, never a real release asset). Until DIV
# cuts one, this mod cannot resolve a real pinned div_version/div_sha512 pair the way it does for
# layered-slopes/layered-slope-grading above. `-PdivLocalJar=<path>` is the only supported way to
# build against DIV today (paired-PR integration validation against a locally built DIV jar),
# matching the same local-jar override pattern layeredslopes already supports.
div_version=UNRELEASED
div_sha512=UNRELEASED

# Shipped version placeholder. Read by the release gate; never edited by hand in a PR. The real
# shipped version lives in git tags, computed by the release workflow from changelog.d fragments
# and passed to the build via `-Pmod_version=...` -- this file's value is never rewritten.
version=0.0.0
