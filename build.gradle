// Slice 2 of MINECRAFT-510's bounded implementation sequence (slice 1: pure erosion
// policy/config module, merged in PR #1). Adds the real NeoForge mod scaffold with pinned
// dependencies on layered-slopes and layered-slope-grading (both have real, sha512-verified
// GitHub releases). The pure erosion policy/config module from slice 1 (the `erosion` package)
// has no Minecraft/NeoForge reference and needs none of this -- its own tests still run under
// plain `./gradlew test` as before.
//
// Deliberately NOT yet declared here: a dynamic-immersive-vehicles (DIV) dependency. DIV ships
// no stable, sha512-pinnable GitHub Release (verified at pickup -- see gradle.properties'
// div_version/div_sha512 comments). Declaring it as a required neoforge.mods.toml dependency
// without a real pinned release would make the default `./gradlew build` fail closed for every
// contributor and CI run, not just this slice -- so the DIV-side wiring (the actual erosion
// consumer that reads its contact telemetry) is deferred to its own later slice, once either a
// real DIV release exists or a local-jar paired-PR build pipeline is set up for it, same as the
// other two dependencies originally needed before their first release existed.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

group = mod_group_id

// Single source of truth for the shipped version is `version=` in gradle.properties, the file
// the release gate reads. A release workflow may override it with `-Pmod_version=<version>`.
def modVersion = (findProperty("mod_version") ?: project.version) as String
version = modVersion

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

repositories {
    // layered-slopes/layered-slope-grading are not on a maven repository; fetched from their
    // GitHub releases, pinned by version and verified by sha512, the same pattern every sibling
    // compat mod in this org uses for these exact dependencies.
    mavenCentral()
}

// layered-slopes provides the LayeredBlock/LayerMath classes this mod's erosion code consumes
// indirectly (through layered-slope-grading's Smoothing service, never directly -- see the
// layeredslopegrading comment below). Required, not optional: this mod cannot function without
// the real registered layered blocks, so this goes on compileOnly AND runtimeOnly.
//
// `-PlayeredslopesLocalJar=<path>` overrides the release download with a locally built jar, for
// paired-PR integration validation before a given layered-slopes release exists -- same pattern
// every sibling repo's build.gradle uses for this dependency.
def localLayeredSlopesJar = findProperty("layeredslopesLocalJar")
def layeredSlopesJar = localLayeredSlopesJar
        ? layout.projectDirectory.file(localLayeredSlopesJar as String)
        : layout.buildDirectory.file("layeredslopes/layeredslopes-${project.layeredslopes_version}.jar")
def effectiveLayeredSlopesVersion = localLayeredSlopesJar ? "0.0.0" : project.layeredslopes_version
def pinnedLayeredSlopesVersion = project.layeredslopes_version
def pinnedLayeredSlopesSha512 = project.layeredslopes_sha512
tasks.register("downloadLayeredSlopes") {
    outputs.file(layeredSlopesJar)
    onlyIf { !localLayeredSlopesJar }
    doLast {
        if (pinnedLayeredSlopesVersion == "UNRELEASED") {
            throw new GradleException("layeredslopes_version/layeredslopes_sha512 in gradle.properties are still " +
                    "a placeholder -- fill them in with the real brooswit-minecraft/layered-slopes release before " +
                    "building, or pass -PlayeredslopesLocalJar=<path> for paired-PR integration validation only.")
        }
        def target = layeredSlopesJar.get().asFile
        target.parentFile.mkdirs()
        def url = "https://github.com/brooswit-minecraft/layered-slopes/releases/download/v${pinnedLayeredSlopesVersion}/layeredslopes-${pinnedLayeredSlopesVersion}.jar"
        new URL(url).withInputStream { input -> target.withOutputStream { it << input } }
        def digest = java.security.MessageDigest.getInstance("SHA-512")
        def actual = digest.digest(target.bytes).encodeHex().toString()
        if (actual != pinnedLayeredSlopesSha512) {
            target.delete()
            throw new GradleException("layered-slopes ${pinnedLayeredSlopesVersion} sha512 mismatch: ${actual}")
        }
    }
}

// layered-slope-grading provides the Smoothing/canSmooth service this mod's erosion consumer
// will call (MINECRAFT-555 prep packet, comment 54607: "DIV depends on layered-slope-grading
// (Smoothing/LayeredMaterials), not layered-slopes directly, and never calls
// LayeredBlock/LayerMath itself"). Required, not optional, for the same reason as layered-slopes
// above.
//
// `-PlayeredslopeGradingLocalJar=<path>` overrides the release download with a locally built
// jar, for paired-PR integration validation before this mod depends on a feature (e.g. the
// SmoothingAuthorizationEvent protection seam from this ticket's own PR #2 on that repo) that
// has not shipped in a real grading release yet.
def localLayeredSlopeGradingJar = findProperty("layeredslopeGradingLocalJar")
def layeredSlopeGradingJar = localLayeredSlopeGradingJar
        ? layout.projectDirectory.file(localLayeredSlopeGradingJar as String)
        : layout.buildDirectory.file("layeredslopegrading/layeredslopegrading-${project.layeredslopegrading_version}.jar")
def effectiveLayeredSlopeGradingVersion = localLayeredSlopeGradingJar ? "0.0.0" : project.layeredslopegrading_version
def pinnedLayeredSlopeGradingVersion = project.layeredslopegrading_version
def pinnedLayeredSlopeGradingSha512 = project.layeredslopegrading_sha512
tasks.register("downloadLayeredSlopeGrading") {
    outputs.file(layeredSlopeGradingJar)
    onlyIf { !localLayeredSlopeGradingJar }
    doLast {
        if (pinnedLayeredSlopeGradingVersion == "UNRELEASED") {
            throw new GradleException("layeredslopegrading_version/layeredslopegrading_sha512 in gradle.properties " +
                    "are still a placeholder -- fill them in with the real brooswit-minecraft/layered-slope-grading " +
                    "release before building, or pass -PlayeredslopeGradingLocalJar=<path> for paired-PR " +
                    "integration validation only.")
        }
        def target = layeredSlopeGradingJar.get().asFile
        target.parentFile.mkdirs()
        def url = "https://github.com/brooswit-minecraft/layered-slope-grading/releases/download/v${pinnedLayeredSlopeGradingVersion}/layeredslopegrading-${pinnedLayeredSlopeGradingVersion}.jar"
        new URL(url).withInputStream { input -> target.withOutputStream { it << input } }
        def digest = java.security.MessageDigest.getInstance("SHA-512")
        def actual = digest.digest(target.bytes).encodeHex().toString()
        if (actual != pinnedLayeredSlopeGradingSha512) {
            target.delete()
            throw new GradleException("layered-slope-grading ${pinnedLayeredSlopeGradingVersion} sha512 mismatch: ${actual}")
        }
    }
}

// Opt-in dependency-failure acceptance (direction, comment 54973): proves NeoForge's own
// mandatory-dependency check actually refuses to boot, with a meaningful message naming the
// missing mod, when a required dependency's jar is absent at runtime -- not merely that SOME
// process exits nonzero. `-PomitRequiredDependency=<modid>` (layeredslopes or
// layeredslopegrading) skips ONLY that jar's runtimeOnly entry below; compileOnly stays so main
// code still compiles. neoforge.mods.toml's own `type="required"` declaration for that modId is
// untouched, so NeoForge's loader genuinely cannot find the mod it was told to require. Never
// set for an ordinary build.
def omitRequiredDependency = findProperty("omitRequiredDependency")

// Opt-in incompatible-version dependency acceptance (direction, comment 54997): proves
// NeoForge's own versionRange check actually refuses to boot, with a meaningful message citing
// the real installed (too old) version against the real required floor, when a dependency IS
// present but below neoforge.mods.toml's declared minimum -- the companion case to the
// missing-dependency acceptance above, which only covers fully absent. `-PincompatibleVersion
// Dependency=<modid>` (layeredslopes or layeredslopegrading) swaps ONLY that jar's runtimeOnly
// entry for a real, pinned, sha512-verified v0.1.0 release -- genuinely below the
// `versionRange="[0.2.0,)"` floor neoforge.mods.toml declares for both -- while compileOnly
// stays on the normal, current, compatible jar so main code still compiles against it. Never
// set for an ordinary build.
def incompatibleVersionDependency = findProperty("incompatibleVersionDependency")
def incompatibleLayeredSlopesVersion = "0.1.0"
def incompatibleLayeredSlopesSha512 = "5f82da46a30aad20763491a498c7d2959e4dd5449bbbce738f2168161669e5f0f59a8bef8c190e78c99eba44fc03068175e28a0d2c5329078eddfe34cad81e33"
def incompatibleLayeredSlopesJar =
        layout.buildDirectory.file("incompatible/layeredslopes-${incompatibleLayeredSlopesVersion}.jar")
def incompatibleLayeredSlopeGradingVersion = "0.1.0"
def incompatibleLayeredSlopeGradingSha512 = "06fecdeae37f5ce3de90dba56fde93e28beb886c0edb3b7c9c49d6957593ec176bacfa150f5f4dc06ad4d13ed23b46024e94d442beb1a7edf7049f79d372bb02"
def incompatibleLayeredSlopeGradingJar =
        layout.buildDirectory.file("incompatible/layeredslopegrading-${incompatibleLayeredSlopeGradingVersion}.jar")
if (incompatibleVersionDependency == "layeredslopes") {
    tasks.register("downloadIncompatibleLayeredSlopes") {
        outputs.file(incompatibleLayeredSlopesJar)
        doLast {
            def target = incompatibleLayeredSlopesJar.get().asFile
            target.parentFile.mkdirs()
            def url = "https://github.com/brooswit-minecraft/layered-slopes/releases/download/v${incompatibleLayeredSlopesVersion}/layeredslopes-${incompatibleLayeredSlopesVersion}.jar"
            new URL(url).withInputStream { input -> target.withOutputStream { it << input } }
            def digest = java.security.MessageDigest.getInstance("SHA-512")
            def actual = digest.digest(target.bytes).encodeHex().toString()
            if (actual != incompatibleLayeredSlopesSha512) {
                target.delete()
                throw new GradleException("layered-slopes ${incompatibleLayeredSlopesVersion} sha512 mismatch: ${actual}")
            }
        }
    }
}
if (incompatibleVersionDependency == "layeredslopegrading") {
    tasks.register("downloadIncompatibleLayeredSlopeGrading") {
        outputs.file(incompatibleLayeredSlopeGradingJar)
        doLast {
            def target = incompatibleLayeredSlopeGradingJar.get().asFile
            target.parentFile.mkdirs()
            def url = "https://github.com/brooswit-minecraft/layered-slope-grading/releases/download/v${incompatibleLayeredSlopeGradingVersion}/layeredslopegrading-${incompatibleLayeredSlopeGradingVersion}.jar"
            new URL(url).withInputStream { input -> target.withOutputStream { it << input } }
            def digest = java.security.MessageDigest.getInstance("SHA-512")
            def actual = digest.digest(target.bytes).encodeHex().toString()
            if (actual != incompatibleLayeredSlopeGradingSha512) {
                target.delete()
                throw new GradleException("layered-slope-grading ${incompatibleLayeredSlopeGradingVersion} sha512 mismatch: ${actual}")
            }
        }
    }
}

// Opt-in paired-runtime check (MINECRAFT-510, direction 54843): DIV has no stable release to
// pin, so there is no download-and-verify task here -- `-PdivLocalJar=<path>` (a jar built
// fresh from DIV's own pinned commit, e.g. by the div-paired-runtime.yml workflow) is the ONLY
// way to put DIV on the classpath at all. Omitting it (the default for every ordinary build)
// means DIV is simply absent -- never a required, always-on dependency.
def localDivJar = findProperty("divLocalJar")
def divJar = localDivJar ? layout.projectDirectory.file(localDivJar as String) : null

// `-PpairedRuntime=true` additionally pulls in DIV's own required runtime dependencies (mts,
// Sable, Sable Companion) at the EXACT coordinates DIV's own build.gradle pins, so a real
// dedicated-server boot has every mod DIV's neoforge.mods.toml actually requires, not just DIV
// itself. Off by default: these two extra Maven hosts and their coordinates are irrelevant to
// every ordinary build and must never affect one.
def pairedRuntime = findProperty("pairedRuntime") == "true"
if (pairedRuntime) {
    repositories {
        maven {
            url = 'https://maven.ryanhcode.dev/releases'
            content { includeGroup 'dev.ryanhcode.sable'; includeGroup 'dev.ryanhcode.sable-companion' }
        }
        maven {
            url = 'https://cursemaven.com'
            content { includeGroup 'curse.maven' }
        }
    }

    def pairedRuntimeWantedCoordinates = [
            'curse.maven:minecraft-transport-simulator-286703',
            'dev.ryanhcode.sable:sable-neoforge-1.21.1',
            'dev.ryanhcode.sable-companion:sable-companion-common-1.21.1',
    ] as Set

    // Matches a resolved artifact's group:name against the wanted-coordinate set. MUST build
    // the key with an explicit .toString(): "${id.group}:${id.name}" is a Groovy GString, and
    // Set.contains(gstring) silently returns false even when the string CONTENT is identical to
    // a member, because GString's hashCode() does not equal the equivalent String's hashCode()
    // -- HashSet.contains looks in the wrong bucket and never finds it. This was a real,
    // previously undiagnosed bug: pairedRuntimeManifest below had been silently matching ZERO
    // artifacts in every real CI run, always falling through to its caller's
    // "(no paired-runtime dependencies resolved)" fallback, confirmed by direct inspection of
    // past div-paired-runtime.yml run logs -- not caught earlier because that fallback made the
    // step still look successful.
    def pairedRuntimeArtifactKey = { art -> "${art.moduleVersion.id.group}:${art.moduleVersion.id.name}".toString() }

    // An exact, verifiable manifest of what paired-runtime actually resolved -- review 54855:
    // the CI workflow previously globbed every "*sable*"/"*minecraft-transport-simulator*" jar
    // out of the whole shared Gradle module cache, which could pick up an unrelated same-named
    // file from some other build on the runner, not necessarily THIS run's own resolution.
    // Querying runtimeClasspath's own ResolvedArtifacts instead names exactly the three
    // coordinates this build.gradle itself declared above, nothing else.
    tasks.register("pairedRuntimeManifest") {
        doLast {
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { art ->
                def key = pairedRuntimeArtifactKey(art)
                if (pairedRuntimeWantedCoordinates.contains(key)) {
                    digest.reset()
                    def hash = digest.digest(art.file.bytes).encodeHex().toString()
                    println "${key}:${art.moduleVersion.id.version} file=${art.file.name} sha256=${hash}"
                }
            }
        }
    }

    // Copies exactly those same three resolved jars (DIV's own real required runtime
    // dependencies) into a plain directory, for the DIV-alone-isolation smoke job (direction,
    // comment 55032) to drop straight into a real server's mods/ folder -- the same
    // artifact-identification discipline as pairedRuntimeManifest above, reused rather than
    // duplicated, never a glob over the shared Gradle cache.
    tasks.register("copyPairedRuntimeJars", Copy) {
        // MUST call from(...) here, in the task's own configuration body, not inside doFirst:
        // AbstractCopyTask snapshots its source specs before execution to decide NO-SOURCE/
        // up-to-date, so a from() added inside doFirst is too late and the task silently no-ops
        // with NO-SOURCE even though the resolved-artifact list below is genuinely non-empty.
        // This block only runs when the task is actually realized (requested on the CLI with
        // -PpairedRuntime=true), so resolving runtimeClasspath here is safe.
        from(configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { art -> pairedRuntimeWantedCoordinates.contains(pairedRuntimeArtifactKey(art)) }
                .collect { it.file })
        into layout.buildDirectory.dir("pairedRuntimeJars")
    }
}

// Opt-in Dynamic-Terrain-paired-runtime check (review 54916/54917/54919/54920): proves
// DynamicTerrainCaveInRisk's real behavior against an actual pinned legacy-dynamic-terrain
// release, with its own real caveInsEnabled config toggled on disk, never as part of the
// default build/test -- this mod has, and must keep, no dependency on Dynamic Terrain.
// Downloads and sha512-verifies the pinned jar, the same pattern layered-slopes/
// layered-slope-grading already use, since (unlike DIV) Dynamic Terrain has real, stable,
// sha512-pinnable GitHub Releases.
def dtPairedRuntime = findProperty("dtPairedRuntime") == "true"
def pinnedDynamicTerrainVersion = "5.0.1"
def pinnedDynamicTerrainSha512 = "c2f85fef911a3f98fc609d8e0a91a54b1fc1fc6769d292e9208a5ed22f8443fbe5a898ce3a3baf6d4746f7ab33e8659bc7d89ff2de1808da8284c5f3de967caf"
def dynamicTerrainJar = layout.buildDirectory.file("dynamicterrain/dynamicterrain-${pinnedDynamicTerrainVersion}.jar")
if (dtPairedRuntime) {
    // Only added to the compiled sourceSet under this opt-in flag: DynamicTerrainPairedGameTests
    // does not exist in the default build/test at all, so it cannot affect
    // scripts/check_gametest_count.py's fixed 18-test expectation for the ordinary run.
    sourceSets.main.java.srcDir('src/dtPaired/java')

    tasks.register("downloadDynamicTerrain") {
        outputs.file(dynamicTerrainJar)
        doLast {
            def target = dynamicTerrainJar.get().asFile
            target.parentFile.mkdirs()
            def url = "https://github.com/brooswit-minecraft/legacy-dynamic-terrain/releases/download/v${pinnedDynamicTerrainVersion}/dynamicterrain-${pinnedDynamicTerrainVersion}.jar"
            new URL(url).withInputStream { input -> target.withOutputStream { it << input } }
            def digest = java.security.MessageDigest.getInstance("SHA-512")
            def actual = digest.digest(target.bytes).encodeHex().toString()
            if (actual != pinnedDynamicTerrainSha512) {
                target.delete()
                throw new GradleException("legacy-dynamic-terrain ${pinnedDynamicTerrainVersion} sha512 mismatch: ${actual}")
            }
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Test-only client-sync probe (direction 55058/55063): never active unless a CI
            // harness explicitly opts in via these Gradle properties. Absent/false by default,
            // so an ordinary ./gradlew runClient is completely unaffected.
            systemProperty 'layeredslopesdynamicimmersivevehicles.clientSyncProbe',
                    (findProperty('erosionClientSyncProbe') ?: 'false') as String
            systemProperty 'layeredslopesdynamicimmersivevehicles.clientSyncProbe.pos',
                    (findProperty('erosionClientSyncProbePos') ?: '') as String
            systemProperty 'layeredslopesdynamicimmersivevehicles.clientSyncProbe.outputFile',
                    (findProperty('erosionClientSyncProbeOutputFile') ?: '') as String
            // Auto-join a local dedicated server headlessly (direction 55058/55063): only when
            // the harness opts in -- an ordinary ./gradlew runClient never gets these arguments.
            if ((findProperty('erosionClientSyncProbe') ?: 'false') == 'true') {
                // Vanilla's quickplay system also requires --quickPlayPath (it logs quickplay
                // session state there) -- CI's first real run observed the client sit at
                // texture/animation loading forever with zero connection activity on either
                // side, consistent with quickplay silently never activating without it.
                programArgument '--quickPlayPath'
                programArgument (findProperty('erosionClientSyncQuickPlayLogPath') ?: 'quickplay-log.json') as String
                programArgument '--quickPlayMultiplayer'
                programArgument (findProperty('erosionClientSyncQuickPlay') ?: 'localhost:25577') as String
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Test-only forced-erosion-attempt command (direction 55058/55063): never registered
            // unless a CI harness explicitly opts in via this Gradle property.
            systemProperty 'layeredslopesdynamicimmersivevehicles.clientSyncTest',
                    (findProperty('erosionClientSyncTest') ?: 'false') as String
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (dtPairedRuntime) {
                // Tells DynamicTerrainPairedGameTests which of Dynamic Terrain's own real
                // caveInsEnabled states THIS boot's pre-written config file set, so it knows
                // which production outcome to require -- never read by production code itself,
                // which always re-derives the real value fresh from the loaded config.
                systemProperty 'dt.caveInsEnabled', (findProperty('dtCaveInsEnabled') ?: 'false') as String
            }
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Gradle's JavaExec tasks (which every NeoForge moddev run resolves to) do NOT forward this
// process's stdin to the forked JVM by default -- CI discovered this the hard way: a whole
// named-pipe console-command-injection harness (setblock/custom test commands, even the final
// "stop") silently never reached a real ./gradlew runServer-booted server at all, with no error,
// because nothing was listening. A human running `./gradlew runServer` directly at a real
// terminal benefits from this too (real console input actually works), so this is wired
// unconditionally, not just for CI.
tasks.named("runServer") {
    standardInput = System.in
}

dependencies {
    compileOnly files(layeredSlopesJar).builtBy(tasks.named("downloadLayeredSlopes"))
    if (incompatibleVersionDependency == "layeredslopes") {
        runtimeOnly files(incompatibleLayeredSlopesJar).builtBy(tasks.named("downloadIncompatibleLayeredSlopes"))
    } else if (omitRequiredDependency != "layeredslopes") {
        runtimeOnly files(layeredSlopesJar).builtBy(tasks.named("downloadLayeredSlopes"))
    }
    compileOnly files(layeredSlopeGradingJar).builtBy(tasks.named("downloadLayeredSlopeGrading"))
    if (incompatibleVersionDependency == "layeredslopegrading") {
        runtimeOnly files(incompatibleLayeredSlopeGradingJar).builtBy(tasks.named("downloadIncompatibleLayeredSlopeGrading"))
    } else if (omitRequiredDependency != "layeredslopegrading") {
        runtimeOnly files(layeredSlopeGradingJar).builtBy(tasks.named("downloadLayeredSlopeGrading"))
    }

    if (divJar != null) {
        compileOnly files(divJar)
        runtimeOnly files(divJar)
    }
    if (pairedRuntime) {
        // Exact coordinates DIV's own build.gradle pins for these three dependencies.
        runtimeOnly('dev.ryanhcode.sable:sable-neoforge-1.21.1:2.0.5') { transitive = false }
        runtimeOnly('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0') { transitive = false }
        runtimeOnly('curse.maven:minecraft-transport-simulator-286703:7926606') { transitive = false }
    }
    if (dtPairedRuntime) {
        compileOnly files(dynamicTerrainJar).builtBy(tasks.named("downloadDynamicTerrain"))
        runtimeOnly files(dynamicTerrainJar).builtBy(tasks.named("downloadDynamicTerrain"))
    }

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Same org.apache.maven.artifact.versioning classes neoforge.mods.toml dependency ranges use
    // under the hood, and the exact version already on the real game runtime classpath
    // (transitively, via the NeoForge moddev plugin) -- pinned explicitly here only so
    // DynamicTerrainCaveInRiskVersionTest's pure version-boundary check can run under plain
    // `./gradlew test`, which has no NeoForge/FML classpath of its own.
    testImplementation 'org.apache.maven:maven-artifact:3.8.5'
}

test {
    useJUnitPlatform()
}

// Expands `${mod_version}` and friends in neoforge.mods.toml to the values computed above, so
// the jar's file name and the version baked into the built jar's mods.toml can never drift apart.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            loader_version_range       : loader_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : modVersion,
            layeredslopes_version      : effectiveLayeredSlopesVersion,
            layeredslopegrading_version: effectiveLayeredSlopeGradingVersion,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
